version: 2
jobs:
  build:
    docker:
      - image: cimg/python:3.13.7
    steps:
      - checkout
      - run: python --version

      # ✅ bump cache key so we don’t reuse the old Django 1.11 environment
      - restore_cache:
          keys:
            - deps3-v2-{{ checksum "requirements.txt" }}

      - run:
          name: Set up venv and install deps
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            # ✅ force upgrades so we don’t get stuck on old Django
            pip install --upgrade -r requirements.txt

      - save_cache:
          paths:
            - "venv"
          key: deps3-v2-{{ checksum "requirements.txt" }}

      - run:
          name: Run tests
          command: |
            . venv/bin/activate
            python manage.py test

      - store_artifacts:
          path: test-reports/
          destination: python_app

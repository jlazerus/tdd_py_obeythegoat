version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.13.7
    steps:
      - checkout

      # Show Python version for debugging
      - run: python --version

      # Cache based on requirements.txt hash
      - restore_cache:
          keys:
            - pip-{{ .Branch }}-{{ checksum "requirements.txt" }}
            - pip-{{ .Branch }}
            - pip-

      # Install deps into system env (no venv needed in CI)
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - save_cache:
          paths:
            - ~/.cache/pip
          key: pip-{{ .Branch }}-{{ checksum "requirements.txt" }}

      - run:
          name: Run tests
          command: |
            python manage.py test

      - store_artifacts:
          path: test-reports/
          destination: python_app
